<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ДОДА - Тарихи Интерактивті Ойын</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        /* 🌟 ЖАНДЫ ТАРИХИ ФОН (Анимациясы бар) */
        body {
            min-height: 100vh;
            color: #fff;
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            background: linear-gradient(135deg, #12002b 0%, #290052 40%, #001233 100%);
        }

        /* Қозғалатын динамикалық сәулелер мен бөлшектер */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(255, 0, 127, 0.25), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0, 242, 254, 0.25), transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 183, 3, 0.15), transparent 50%);
            animation: moveLight 8s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes moveLight {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.15) translate(-20px, 20px); }
        }

        /* 🏛️ Ұлттық Ою-өрнек көлеңкелі жиегі (Артқы фонда) */
        .history-bg-ornament {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(255, 183, 3, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            border: 2px dashed rgba(255, 255, 255, 0.08);
            pointer-events: none;
            z-index: 0;
            animation: rotateBg 40s linear infinite;
        }

        @keyframes rotateBg {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .main-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 🔥 ӨТЕ ЖАРҚЫН "ДОДА" ТАҚЫРЫБЫ */
        .main-title {
            font-size: 5.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 10px;
            background: linear-gradient(45deg, #ff007f, #ffb703, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 25px rgba(255, 0, 127, 0.8));
            margin-bottom: 5px;
            text-align: center;
            animation: glowPulse 2s infinite alternate;
        }

        @keyframes glowPulse {
            0% { filter: drop-shadow(0 0 15px rgba(255, 0, 127, 0.8)); }
            100% { filter: drop-shadow(0 0 35px rgba(0, 242, 254, 1)); }
        }

        .subtitle {
            font-size: 1.25rem;
            color: #ffb703;
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: 3px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 183, 3, 0.5);
        }

        /* 3 Командалық Ұпай Есептегіш */
        .scoreboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
            margin-bottom: 35px;
        }

        .team-card {
            background: rgba(20, 10, 35, 0.6);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            transition: 0.3s;
        }

        .team-1 { border: 2px solid #ff007f; box-shadow: 0 0 20px rgba(255, 0, 127, 0.3); }
        .team-2 { border: 2px solid #ffb703; box-shadow: 0 0 20px rgba(255, 183, 3, 0.3); }
        .team-3 { border: 2px solid #00f2fe; box-shadow: 0 0 20px rgba(0, 242, 254, 0.3); }

        .team-1 h3 { color: #ff007f; }
        .team-2 h3 { color: #ffb703; }
        .team-3 h3 { color: #00f2fe; }

        .team-score {
            font-size: 3rem;
            font-weight: 900;
            margin: 5px 0;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .score-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            margin: 2px;
        }

        .score-btn:hover { background: #fff; color: #000; }

        /* 📦 ЖАРҚЫРАҒАН НЕОНДЫ ТОРШАЛАР (Баллсыз, Сондай-ақ Тек 1,2,3) */
        .cells-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .cell-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.03) 100%);
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .cell-card::after {
            content: "";
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255,255,255,0.15), transparent);
            transform: rotate(30deg);
            transition: 0.5s;
        }

        .cell-card:hover::after {
            left: 100%;
        }

        .cell-card:hover {
            transform: translateY(-8px) scale(1.03);
            border-color: #ffb703;
            box-shadow: 0 0 30px rgba(255, 183, 3, 0.6);
        }

        .cell-number {
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(45deg, #fff, #ffb703);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(255, 183, 3, 0.5);
        }

        .cell-label {
            font-size: 0.9rem;
            color: #a0a5c3;
            font-weight: 700;
            letter-spacing: 2px;
        }

        /* Таңдалған торша */
        .cell-card.opened {
            background: rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.05);
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .cell-card.opened .cell-number {
            background: #555;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Сұрақ Терезесі (Modal) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(5, 2, 15, 0.9);
            backdrop-filter: blur(12px);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-content {
            background: #120a21;
            border: 2px solid #ff007f;
            color: #fff;
            padding: 35px;
            border-radius: 24px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 0 50px rgba(255, 0, 127, 0.5);
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-header {
            font-size: 1.5rem;
            font-weight: 900;
            color: #ffb703;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .modal-question {
            font-size: 1.4rem;
            font-weight: 700;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #ffffff;
        }

        .modal-answer {
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid #00f2fe;
            padding: 18px;
            border-radius: 12px;
            font-size: 1.25rem;
            font-weight: bold;
            color: #00f2fe;
            display: none;
            margin-bottom: 25px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: space-between;
        }

        .btn-action {
            padding: 14px 22px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-show { background: #00f2fe; color: #000; }
        .btn-close { background: #ff007f; color: white; }

        .btn-action:hover { opacity: 0.9; transform: scale(1.03); }

        @media (max-width: 768px) {
            .cells-grid { grid-template-columns: repeat(2, 1fr); }
            .scoreboard { grid-template-columns: 1fr; }
            .main-title { font-size: 3.5rem; }
        }
    </style>
</head>
<body>

    <!-- Артқы фондағы Тарихи Ою Анимациясы -->
    <div class="history-bg-ornament"></div>

    <div class="main-container">
        <!-- Неонды Тақырып -->
        <h1 class="main-title">ДОДА</h1>
        <p class="subtitle">ҚАЗАҚСТАН ТАРИХЫ • ТАҢДАУЛЫ ТОРШАЛАР</p>

        <!-- 3 Команда Тақтасы -->
        <div class="scoreboard">
            <div class="team-card team-1">
                <h3>1-КОМАНДА</h3>
                <div class="team-score" id="score-1">0</div>
                <button class="score-btn" onclick="updateScore(1, 1)">+1 Ұпай</button>
                <button class="score-btn" onclick="updateScore(1, -1)">-1</button>
            </div>

            <div class="team-card team-2">
                <h3>2-КОМАНДА</h3>
                <div class="team-score" id="score-2">0</div>
                <button class="score-btn" onclick="updateScore(2, 1)">+1 Ұпай</button>
                <button class="score-btn" onclick="updateScore(2, -1)">-1</button>
            </div>

            <div class="team-card team-3">
                <h3>3-КОМАНДА</h3>
                <div class="team-score" id="score-3">0</div>
                <button class="score-btn" onclick="updateScore(3, 1)">+1 Ұпай</button>
                <button class="score-btn" onclick="updateScore(3, -1)">-1</button>
            </div>
        </div>

        <!-- Торшалар (Баллсыз, Тек Сандары Бар) -->
        <div class="cells-grid">
            <div class="cell-card" id="cell-1" onclick="openCell(1)">
                <div class="cell-number">1</div>
                <div class="cell-label">ТОРША</div>
            </div>

            <div class="cell-card" id="cell-2" onclick="openCell(2)">
                <div class="cell-number">2</div>
                <div class="cell-label">ТОРША</div>
            </div>

            <div class="cell-card" id="cell-3" onclick="openCell(3)">
                <div class="cell-number">3</div>
                <div class="cell-label">ТОРША</div>
            </div>

            <div class="cell-card" id="cell-4" onclick="openCell(4)">
                <div class="cell-number">4</div>
                <div class="cell-label">ТОРША</div>
            </div>

            <div class="cell-card" id="cell-5" onclick="openCell(5)">
                <div class="cell-number">5</div>
                <div class="cell-label">ТОРША</div>
            </div>

            <div class="cell-card" id="cell-6" onclick="openCell(6)">
                <div class="cell-number">6</div>
                <div class="cell-label">ТОРША</div>
            </div>
        </div>
    </div>

    <!-- Модальді Сұрақ Экран -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <div class="modal-header" id="modal-cell-name">1-ТОРША СҰРАҒЫ</div>
            <div class="modal-question" id="modal-q-text">Сұрақ мазмұны...</div>
            <div class="modal-answer" id="modal-a-text">Дұрыс жауабы: ...</div>
            <div class="modal-actions">
                <button class="btn-action btn-show" onclick="toggleAnswer()">Жауапты көрсету</button>
                <button class="btn-action btn-close" onclick="closeCell()">Жабу</button>
            </div>
        </div>
    </div>

<script>
    // 6 Тарихи Сұрақтар
    const questions = {
        1: {
            q: "Бүкіл Қазақстанды қамтыған ұлт-азаттық көтеріліс қай ханның тұсында болды?",
            a: "Кенесары Қасымұлы ханның тұсында (1837–1847 жж.)"
        },
        2: {
            q: "14 жылға созылған көтерілістің басшысы кім?",
            a: "Сырым Датұлы (1783–1797 жж. Киші жүздегі көтеріліс)"
        },
        3: {
            q: "Ішкі Бөкей Ордасында болған көтеріліс қай ханға бағытталды?",
            a: "Жәңгір ханға бағытталды (Исатай мен Махамбет бастаған көтеріліс)"
        },
        4: {
            q: "Ұлт-азаттық көтерілістің нәтижесін алдын ала болжап, лажсыз Ресей патшалығының билігін мойындауға мәжбүр болған көтеріліс басшысы?",
            a: "Жанқожа Нұрмұхамедұлы"
        },
        5: {
            q: "Тентек төре наразылығы Қазақ елінің қай жерінде болды?",
            a: "Жетісу өңірінде (1821 ж. Қоқан хандығының езгісіне қарсы)"
        },
        6: {
            q: "«Қой үстінде бозторғай жұмыртқалаған заман» қай ханның тұсында болды?",
            a: "Әз-Тәуке ханның тұсында (Қазақ хандығының бейбіт дәуірі)"
        }
    };

    let scores = { 1: 0, 2: 0, 3: 0 };
    let currentCellId = null;

    function openCell(id) {
        const cellElem = document.getElementById(`cell-${id}`);
        if (cellElem.classList.contains('opened')) return;

        currentCellId = id;
        document.getElementById('modal-cell-name').innerText = `${id}-ТОРША СҰРАҒЫ`;
        document.getElementById('modal-q-text').innerText = questions[id].q;
        document.getElementById('modal-a-text').innerText = `Дұрыс жауабы: ${questions[id].a}`;
        document.getElementById('modal-a-text').style.display = 'none';

        document.getElementById('modal').style.display = 'flex';
    }

    function toggleAnswer() {
        const answerBlock = document.getElementById('modal-a-text');
        answerBlock.style.display = answerBlock.style.display === 'none' ? 'block' : 'none';
    }

    function closeCell() {
        document.getElementById('modal').style.display = 'none';
        if (currentCellId) {
            const cellElem = document.getElementById(`cell-${currentCellId}`);
            cellElem.classList.add('opened');
        }
    }

    function updateScore(team, val) {
        scores[team] += val;
        if (scores[team] < 0) scores[team] = 0;
        document.getElementById(`score-${team}`).innerText = scores[team];
    }
</script>

</body>
</html>
